<div class="dashboard">

  <div class="welcome-banner">
    <div>
      <h1>Bienvenido, {{ user?.name }} 👋</h1>
      <p>Aquí tienes un resumen del sistema.</p>
    </div>
  </div>

  <!-- Tarjetas de estadísticas -->
  <div class="stats-grid">
    <div class="stat-card" *ngFor="let stat of visibleStats">
      <div class="stat-icon" [style.background]="stat.color + '18'">
        <i [class]="stat.icon" [style.color]="stat.color"></i>
      </div>
      <div class="stat-info">
        <span class="stat-value">{{ stat.value }}</span>
        <span class="stat-label">{{ stat.label }}</span>
      </div>
    </div>
  </div>

  <!-- Actividad reciente -->
  <p-card *ngIf="authService.hasPermission('profiles')" class="recent-card">
    <ng-template pTemplate="header">
      <div class="card-header">
        <h2><i class="pi pi-history"></i> Actividad reciente</h2>
      </div>
    </ng-template>

    <p-table [value]="recentLogs" styleClass="p-datatable-sm">
      <ng-template pTemplate="header">
        <tr>
          <th>Usuario</th>
          <th>Acción</th>
          <th>Módulo</th>
          <th>Fecha</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-log>
        <tr>
          <td>{{ log.user_name }}</td>
          <td>
            <p-tag
              [value]="log.action_label"
              [severity]="actionSeverity(log.action)"
            ></p-tag>
          </td>
          <td>{{ log.model }}</td>
          <td>{{ log.logged_at | date:'dd/MM/yyyy HH:mm' }}</td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4" style="text-align:center; color:#999; padding:2rem">
            Sin actividad reciente
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>

</div>
