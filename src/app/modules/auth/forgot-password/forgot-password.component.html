<div class="login-wrapper">
  <p-toast></p-toast>

  <div class="login-card">

    <!-- Estado inicial: formulario -->
    <ng-container *ngIf="!sent">
      <div class="login-header">
        <i class="pi pi-lock login-icon"></i>
        <h1>Recuperar contraseña</h1>
        <p>Ingresa tu correo y te enviaremos las instrucciones.</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input
            id="email"
            type="email"
            pInputText
            formControlName="email"
            placeholder="tu@correo.com"
            [class.ng-invalid]="f['email'].invalid && f['email'].touched"
          />
          <small class="error" *ngIf="f['email'].invalid && f['email'].touched">
            Ingresa un correo válido.
          </small>
        </div>

        <button
          pButton
          type="submit"
          label="Enviar instrucciones"
          icon="pi pi-send"
          [loading]="loading"
          class="p-button-primary w-full"
        ></button>
      </form>
    </ng-container>

    <!-- Estado: enviado -->
    <ng-container *ngIf="sent">
      <div class="success-state">
        <i class="pi pi-check-circle success-icon"></i>
        <h2>¡Correo enviado!</h2>
        <p>
          Si el correo existe en nuestro sistema, recibirás
          las instrucciones para recuperar tu contraseña.
        </p>
        <p class="hint">Revisa también tu carpeta de spam.</p>
      </div>
    </ng-container>

    <!-- Volver al login -->
    <a routerLink="/auth/login" class="forgot-link">
      <i class="pi pi-arrow-left"></i> Volver al inicio de sesión
    </a>

  </div>
</div>
